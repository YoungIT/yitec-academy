<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YITEC Academy</title>
    <meta name="description" content="Seminars for the YITEC team." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Patrick+Hand&display=swap"
    />
  </head>
  <body>
    <!-- Roughens ink edges so paper and borders look hand-drawn. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
    </svg>
    <div class="scene">
      <header class="topbar">
        <a class="brand" href="%BASE_URL%" aria-label="YITEC Academy home">
          <img class="brand-logo" src="/logo.png" alt="" width="256" height="256" />
          <span class="brand-name">YITEC Academy</span>
        </a>
      </header>
      <main class="library">
        <div class="bookcase" id="bookcase"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
